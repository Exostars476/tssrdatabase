name: Build and Deploy to gh-pages

on:
  push:
    branches:
      - main            # ← déclenche sur push vers main (modifie si tu veux dev)
  workflow_dispatch:    # ← bouton "Run workflow" manuel (optionnel)

permissions:
  contents: write       # nécessaire pour pousser sur gh-pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Fallback SPA pour React Router (facultatif mais recommandé)
      - name: Copy 404.html
        run: cp dist/index.html dist/404.html

      # Déploiement du dossier dist/ vers la branche gh-pages
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages      # branche cible (celle servie par GitHub Pages)
          folder: dist          # dossier à publier
          clean: true           # nettoie les anciens fichiers
